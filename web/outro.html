<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOMIC :: OUTRO</title>
<meta name="description" content="End card for NOMIC on GenLayer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --scr: #060A06;
  --p1: #4CEF60;
  --dim: #4FB35F;
  --mid: #8FE79C;
  --hi: #C9FFD1;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
}

body {
  background: var(--scr);
  color: var(--p1);
  font-family: "VT323", "Courier New", ui-monospace, monospace;
  font-size: clamp(18px, 1.95vw, 38px);
  line-height: 1.4;
  letter-spacing: 0.01em;
  display: flex;
  align-items: center;
  justify-content: center;
}

.crt {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  background:
    repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.26) 2px 4px),
    radial-gradient(120% 100% at 50% 45%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.62) 100%);
}

.stage { width: min(1240px, 90vw); padding: 0 2vw; }

.banner {
  margin: 0;
  white-space: pre;
  font-size: clamp(11px, 1.28vw, 25px);
  line-height: 1.04;
  letter-spacing: 0.1em;
  color: var(--hi);
  opacity: 0;
}

.close {
  margin: 1.25em 0 0;
  min-height: 2.9em;
  max-width: 40ch;
  color: var(--hi);
  font-size: 1.28em;
  line-height: 1.32;
}

.close .rev { background: var(--p1); color: var(--scr); padding: 0 0.3em; }

.caret {
  display: inline-block;
  width: 0.5em;
  height: 1em;
  background: var(--p1);
  vertical-align: -0.14em;
  margin-left: 0.12em;
}

hr.rule {
  border: none;
  border-top: 1px solid var(--dim);
  margin: 1.5em 0 1.25em;
  opacity: 0;
}

.links { margin: 0; display: grid; gap: 0.34em 1.4em; }

.links .row {
  display: grid;
  grid-template-columns: 8.5em minmax(0, 1fr);
  gap: 0 1em;
  align-items: baseline;
  opacity: 0;
}

.links .k { color: var(--dim); letter-spacing: 0.12em; }

.links a {
  color: var(--hi);
  text-decoration: none;
  border-bottom: 1px dotted #2C7A3A;
}

.links a:hover { color: #FFFFFF; border-bottom-style: solid; }
.links .v { color: var(--mid); }
.links .v b { color: var(--hi); font-weight: normal; }

.foot {
  margin: 1.6em 0 0;
  color: var(--dim);
  letter-spacing: 0.12em;
  font-size: 0.82em;
  opacity: 0;
}

.fade { transition: opacity 620ms linear; }
.fade.in { opacity: 1; }

@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.05; } }
.blink { animation: blink 1.1s steps(1, end) infinite; }

@media (prefers-reduced-motion: reduce) {
  .fade { transition: none; }
  .blink { animation: none; }
}
</style>
</head>
<body>

<div class="crt"></div>

<main class="stage">
  <pre class="banner fade" id="banner" aria-label="NOMIC">#   #  ###  #   # #####  ####
##  # #   # ## ##   #   #    
# # # #   # # # #   #   #    
#  ## #   # #   #   #   #    
#   #  ###  #   # #####  ####</pre>

  <p class="close"><span id="close"></span><span class="caret blink"></span></p>

  <hr class="rule fade" id="rule">

  <div class="links">
    <div class="row fade" id="l0">
      <span class="k">SOURCE</span>
      <span><a href="https://github.com/Zhekinmaksim/nomic">github.com/Zhekinmaksim/nomic</a></span>
    </div>
    <div class="row fade" id="l1">
      <span class="k">PLAY</span>
      <span><a href="https://playnomic.xyz">playnomic.xyz</a></span>
    </div>
    <div class="row fade" id="l2">
      <span class="k">BUILT BY</span>
      <span class="v"><b>ZER&#x398; M&#x39B;XX</b> &nbsp;//&nbsp; @0maxxdev</span>
    </div>
  </div>

  <p class="foot fade" id="foot">AN INTELLIGENT CONTRACT ON GENLAYER TESTNET BRADBURY</p>
</main>

<script>
(function () {
  "use strict";

  var SPEED = Number(new URLSearchParams(location.search).get("speed") || 1);
  var REDUCED = window.matchMedia
    && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // The closing line is the thesis in one sentence. UNDETERMINED lands in
  // reverse video, the way the terminal shows it everywhere else.
  var PLAIN = "The judge said UNDETERMINED. The players voted. The rulebook changed.";
  var MARKED = 'The judge said <span class="rev">UNDETERMINED</span>. '
    + "The players voted. The rulebook changed.";

  var timers = [];
  function at(ms, fn) { timers.push(setTimeout(fn, ms / SPEED)); }
  function show(id) { document.getElementById(id).classList.add("in"); }

  function type(el, text, cps, done) {
    if (REDUCED) { el.textContent = text; if (done) { done(); } return; }
    var i = 0;
    var t = setInterval(function () {
      i += 1;
      el.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(t); if (done) { done(); } }
    }, 1000 / cps / SPEED);
    timers.push(t);
  }

  function play() {
    timers.forEach(clearTimeout);
    timers = [];
    ["banner", "rule", "l0", "l1", "l2", "foot"].forEach(function (id) {
      document.getElementById(id).classList.remove("in");
    });
    document.getElementById("close").innerHTML = "";

    at(120, function () { show("banner"); });
    at(820, function () {
      type(document.getElementById("close"), PLAIN, 30, function () {
        document.getElementById("close").innerHTML = MARKED;
      });
    });

    var t0 = 820 + (PLAIN.length / 30) * 1000 + 420;
    at(t0, function () { show("rule"); });
    at(t0 + 280, function () { show("l0"); });
    at(t0 + 620, function () { show("l1"); });
    at(t0 + 960, function () { show("l2"); });
    at(t0 + 1500, function () { show("foot"); });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "r" || e.key === "R" || e.key === " ") { e.preventDefault(); play(); }
  });
  document.addEventListener("click", function (e) {
    if (e.target.tagName !== "A") { play(); }
  });

  play();
})();
</script>

</body>
</html>
