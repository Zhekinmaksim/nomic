<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOMIC :: INTRO</title>
<meta name="description" content="Title card for NOMIC on GenLayer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
/* A title card in the same terminal the game runs in. Sized for a 16:9
   capture: everything scales off the viewport width, so recording at 1920 or
   at 1280 gives the same framing. */

:root {
  --scr: #060A06;
  --p1: #4CEF60;
  --dim: #4FB35F;
  --mid: #8FE79C;
  --hi: #C9FFD1;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
}

body {
  background: var(--scr);
  color: var(--p1);
  font-family: "VT323", "Courier New", ui-monospace, monospace;
  font-size: clamp(18px, 1.95vw, 38px);
  line-height: 1.4;
  letter-spacing: 0.01em;
  display: flex;
  align-items: center;
  justify-content: center;
}

.crt {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  background:
    repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.26) 2px 4px),
    radial-gradient(120% 100% at 50% 45%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.62) 100%);
}

.stage {
  width: min(1240px, 90vw);
  padding: 0 2vw;
}

.banner {
  margin: 0;
  white-space: pre;
  font-size: clamp(11px, 1.28vw, 25px);
  line-height: 1.04;
  letter-spacing: 0.1em;
  color: var(--hi);
  opacity: 0;
}

.sub {
  margin: 1.1em 0 0;
  color: var(--dim);
  letter-spacing: 0.14em;
  opacity: 0;
}

.rule {
  border: none;
  border-top: 1px solid var(--dim);
  margin: 1.3em 0 1.2em;
  opacity: 0;
}

.boot { margin: 0; min-height: 7.2em; }

.boot .row {
  display: grid;
  grid-template-columns: 10.5em minmax(0, 1fr) 3.2em;
  gap: 0 1em;
  align-items: baseline;
  visibility: hidden;
}

.boot .row.on { visibility: visible; }
.boot .k { color: var(--mid); letter-spacing: 0.1em; }
.boot .v { color: var(--p1); }
.boot .ok { color: var(--hi); text-align: right; opacity: 0; }
.boot .row.done .ok { opacity: 1; }

.rev {
  background: var(--p1);
  color: var(--scr);
  padding: 0 0.35em;
}

.pitch { margin: 0; min-height: 3.6em; }
.pitch .p1line { color: var(--hi); }
.pitch .ps { color: var(--mid); }
.pitch .p2line { display: block; margin-top: 0.35em; color: var(--mid); }

.caret {
  display: inline-block;
  width: 0.5em;
  height: 1em;
  background: var(--p1);
  vertical-align: -0.14em;
  margin-left: 0.12em;
}

.foot {
  margin: 1.5em 0 0;
  color: var(--dim);
  letter-spacing: 0.12em;
  font-size: 0.82em;
  opacity: 0;
}

.fade { transition: opacity 620ms linear; }
.fade.in { opacity: 1; }

@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.05; } }
.blink { animation: blink 1.1s steps(1, end) infinite; }

@media (prefers-reduced-motion: reduce) {
  .fade { transition: none; }
  .blink { animation: none; }
}
</style>
</head>
<body>

<div class="crt"></div>

<main class="stage">
  <pre class="banner fade" id="banner" aria-label="NOMIC">#   #  ###  #   # #####  ####
##  # #   # ## ##   #   #    
# # # #   # # # #   #   #    
#  ## #   # #   #   #   #    
#   #  ###  #   # #####  ####</pre>

  <p class="sub fade" id="sub">SELF AMENDING RULE ENGINE &nbsp;//&nbsp; AFTER SUBER, 1982</p>

  <hr class="rule fade" id="rule">

  <div class="boot" id="boot">
    <div class="row" data-row="0">
      <span class="k">RULEBOOK</span>
      <span class="v"></span>
      <span class="ok">OK</span>
    </div>
    <div class="row" data-row="1">
      <span class="k">JUDGE</span>
      <span class="v"></span>
      <span class="ok">OK</span>
    </div>
    <div class="row" data-row="2">
      <span class="k">BOARD</span>
      <span class="v"></span>
      <span class="ok">OK</span>
    </div>
    <div class="row" data-row="3">
      <span class="k">VERDICTS</span>
      <span class="v"></span>
      <span class="ok">OK</span>
    </div>
  </div>

  <hr class="rule fade" id="rule2">

  <p class="pitch">
    <span class="ps">nomic&gt;</span>
    <span class="p1line" id="line1"></span><span class="caret blink" id="caret"></span>
    <span class="p2line" id="line2"></span>
  </p>

  <p class="foot fade" id="foot">GENLAYER TESTNET BRADBURY</p>
</main>

<script>
(function () {
  "use strict";

  var SPEED = Number(new URLSearchParams(location.search).get("speed") || 1);
  var REDUCED = window.matchMedia
    && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var ROWS = [
    { text: "10 RULES, 5 IMMUTABLE, 5 MUTABLE, HASH PINNED", html: null },
    { text: "CONSENSUS ACROSS INDEPENDENT VALIDATORS", html: null },
    { text: "GENLAYER TESTNET BRADBURY", html: null },
    {
      text: "LEGAL / ILLEGAL / UNDETERMINED",
      html: 'LEGAL / ILLEGAL / <span class="rev blink">UNDETERMINED</span>'
    }
  ];

  var LINE1 = "A game where changing the rules is a move.";
  var LINE2 = "The contract enforces rule text that did not exist when it was deployed.";

  var timers = [];
  function at(ms, fn) { timers.push(setTimeout(fn, ms / SPEED)); }
  function clear() { timers.forEach(clearTimeout); timers = []; }

  function show(id) { document.getElementById(id).classList.add("in"); }

  function type(el, text, cps, done) {
    if (REDUCED) { el.textContent = text; if (done) { done(); } return; }
    var i = 0;
    var step = 1000 / cps / SPEED;
    var t = setInterval(function () {
      i += 1;
      el.textContent = text.slice(0, i);
      if (i >= text.length) {
        clearInterval(t);
        if (done) { done(); }
      }
    }, step);
    timers.push(t);
  }

  function play() {
    clear();
    ["banner", "sub", "rule", "rule2", "foot"].forEach(function (id) {
      document.getElementById(id).classList.remove("in");
    });
    document.getElementById("line1").textContent = "";
    document.getElementById("line2").textContent = "";
    Array.prototype.forEach.call(document.querySelectorAll(".row"), function (r) {
      r.className = "row";
      r.querySelector(".v").innerHTML = "";
    });

    at(120, function () { show("banner"); });
    at(760, function () { show("sub"); });
    at(1320, function () { show("rule"); });

    var t0 = 1700;
    ROWS.forEach(function (row, i) {
      at(t0 + i * 950, function () {
        var el = document.querySelector('[data-row="' + i + '"]');
        el.classList.add("on");
        type(el.querySelector(".v"), row.text, 55, function () {
          if (row.html) { el.querySelector(".v").innerHTML = row.html; }
          setTimeout(function () { el.classList.add("done"); }, 160 / SPEED);
        });
      });
    });

    var tPitch = t0 + ROWS.length * 950 + 500;
    at(tPitch, function () { show("rule2"); });
    at(tPitch + 380, function () {
      type(document.getElementById("line1"), LINE1, 34, function () {
        at(0, function () {
          type(document.getElementById("line2"), LINE2, 46);
        });
      });
    });
    at(tPitch + 3400, function () { show("foot"); });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "r" || e.key === "R" || e.key === " ") { e.preventDefault(); play(); }
  });
  document.addEventListener("click", play);

  play();
})();
</script>

</body>
</html>
